name: PetSewa CI/CD Workflow

on:
  push:
    branches: [ main, master, development, staging ]
  pull_request:
    branches: [ main, master, development ]

jobs:
  # -------------------------------------------------------------
  # Job 0: Enforce Main Branch Protection & Core Authorization
  # -------------------------------------------------------------
  branch-guard:
    name: Verify Main Branch Authorization
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Validate Committer Against Core Team
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.actor.toLowerCase();
            const authorizedCore = ['pathakaanya12', 'hammaduddin561', 'yantrikminds', 'petsewa'];
            
            console.log(`Checking push authorization for actor: ${context.actor}`);
            if (!authorizedCore.includes(actor)) {
              core.setFailed(`🚫 ACCESS DENIED: User '${context.actor}' is NOT authorized to push directly to 'main'! Only Core Administrators (${authorizedCore.join(', ')}) have direct main permissions. All developers must work on a feature branch and submit a Pull Request.`);
            } else {
              console.log(`✅ Push authorized for core administrator: ${context.actor}`);
            }

  # -------------------------------------------------------------
  # Job 1: Build NestJS Core Backend API
  # -------------------------------------------------------------
  backend-ci:
    name: Backend (NestJS) Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./petsewa-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './petsewa-backend/package.json'

      - name: Install Backend Dependencies
        run: npm ci || npm install

      - name: Build NestJS Application
        run: npm run build

  # -------------------------------------------------------------
  # Job 2: Analyze & Test Flutter Mobile Application
  # -------------------------------------------------------------
  flutter-ci:
    name: Flutter Mobile Application CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./petsewa_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer / Lints
        run: flutter analyze || true

      - name: Build Web Target Test
        run: flutter build web --no-pub
