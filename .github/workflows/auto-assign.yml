# ==============================================================================
# PetSewa — Automated Reviewer & Triage Assignment System
# Organization: PetSewa-India
# ==============================================================================

name: Auto Assign Reviewers & Triage

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  pull_request:
    types: [opened, reopened, ready_for_review]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Auto-assign Reviewers from Core Team to Pull Requests
  # ---------------------------------------------------------------------------
  auto-assign-pr:
    name: Auto Request Review from Core Team
    if: github.event.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Request Review from Core Team Members
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;

            // List of Core Reviewers to assign
            const coreReviewers = ['pathakaanya12', 'Hammaduddin561', 'Janvi1bhardwaj', 'bhumika-1320'];
            
            // Filter out the PR author so GitHub API does not reject self-review request
            const assignedReviewers = coreReviewers.filter(u => u.toLowerCase() !== author.toLowerCase());

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number,
                reviewers: assignedReviewers,
                team_reviewers: ['petsewa-core']
              });
              console.log('Successfully assigned core reviewers:', assignedReviewers);
            } catch (error) {
              console.log('Notice requesting reviewers:', error.message);
              // Fallback to individual user requests if team permission fails
              try {
                await github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number,
                  reviewers: assignedReviewers
                });
                console.log('Successfully assigned individual reviewers fallback:', assignedReviewers);
              } catch (err2) {
                console.log('Individual fallback log:', err2.message);
              }
            }

  # ---------------------------------------------------------------------------
  # 2. Auto-label & Triage New Issues & Proposals
  # ---------------------------------------------------------------------------
  auto-triage-issue:
    name: Auto Triage & Assign Issues/Proposals
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Add Triage Labels & Core Assignment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.issue.number;
            
            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: ['triage', 'needs-review']
              });
              console.log('Successfully added triage labels for Petsewa Core review!');
            } catch (error) {
              console.log('Issue Triage log:', error.message);
            }
