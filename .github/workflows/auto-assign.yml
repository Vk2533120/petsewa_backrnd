# ==============================================================================
# PetSewa — Automated Randomized Reviewer & Strict Triage Governance
# Organization: PetSewa-India
# ==============================================================================

name: Auto Assign Reviewers & Triage Governance

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, assigned]
  pull_request:
    types: [opened, reopened, ready_for_review]
  issues:
    types: [opened, assigned]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Randomly Select & Assign Reviewers from Petsewa Core Team
  # ---------------------------------------------------------------------------
  auto-assign-pr:
    name: Assign Random Core Team Reviewers
    if: github.event.pull_request != null && github.event.action != 'assigned'
    runs-on: ubuntu-latest
    steps:
      - name: Pick Random Reviewers from Core Team
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;

            // Full list of 4 Core Team Members
            const coreTeam = ['pathakaanya12', 'Hammaduddin561', 'YantrikMinds', 'petsewa'];

            // Filter out the PR author (cannot review own PR)
            const eligibleReviewers = coreTeam.filter(
              u => u.toLowerCase() !== author.toLowerCase()
            );

            if (eligibleReviewers.length === 0) {
              console.log('No eligible core reviewers found.');
              return;
            }

            // Shuffle randomly to distribute review workload
            const shuffled = eligibleReviewers.sort(() => 0.5 - Math.random());
            
            // Pick 1 to 2 random core reviewers
            const numberOfReviewers = Math.min(shuffled.length, 2);
            const selectedReviewers = shuffled.slice(0, numberOfReviewers);

            console.log(`Assigning random core reviewers for PR #${pull_number}:`, selectedReviewers);

            try {
              await github.rest.pulls.requestReviewers({
                owner,
                repo,
                pull_number,
                reviewers: selectedReviewers
              });
              console.log('Successfully assigned random core reviewers:', selectedReviewers);
            } catch (error) {
              console.log('Random reviewer assignment notice:', error.message);
            }

  # ---------------------------------------------------------------------------
  # 2. Strict Assignee Enforcer (Core Team, Admins & Moderators ONLY)
  # ---------------------------------------------------------------------------
  enforce-core-assignees:
    name: Enforce Core-Only Assignees
    runs-on: ubuntu-latest
    steps:
      - name: Validate Assignees Against Core Team Roster
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const target = context.payload.pull_request || context.payload.issue;
            
            if (!target) return;
            const targetNumber = target.number;
            const assignees = target.assignees || [];

            // Authorized Core, Leadership, and Engineering Group Members
            const authorizedCore = [
              'pathakaanya12', 'hammaduddin561', 'yantrikminds', 'petsewa',
              'sobiya-25', 'sriramofficialsit', 'amitlaware', 'hemant815',
              'sujalparab7', 'auc125au', 'user-payal', 'vk2533120', 'pratikk0110',
              'janvi1bhardwaj', 'yogita-1206'
            ];

            for (const assignee of assignees) {
              const username = assignee.login.toLowerCase();
              if (!authorizedCore.includes(username)) {
                console.log(`Blocking unauthorized assignee: ${assignee.login}. Only Core/Admins allowed.`);
                try {
                  await github.rest.issues.removeAssignees({
                    owner,
                    repo,
                    issue_number: targetNumber,
                    assignees: [assignee.login]
                  });
                  console.log(`Successfully removed unauthorized assignee: ${assignee.login}`);
                } catch (err) {
                  console.log('Remove assignee log:', err.message);
                }
              }
            }

  # ---------------------------------------------------------------------------
  # 3. Auto-label & Triage New Issues & Proposals
  # ---------------------------------------------------------------------------
  auto-triage-issue:
    name: Auto Triage & Assign Issues/Proposals
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Add Triage Labels & Core Assignment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map(l => l.name);

            // Skip auto-triage labeling if already tagged as task
            if (labels.includes('task')) {
              return;
            }
            
            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: ['triage', 'needs-review']
              });
              console.log('Successfully added triage labels for Petsewa Core review!');
            } catch (error) {
              console.log('Issue Triage log:', error.message);
            }
